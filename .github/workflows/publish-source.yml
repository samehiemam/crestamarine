name: Publish Cresta Marine source

on:
  push:
    paths:
      - "cresta-source.zip.part-*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import verified website source
        run: |
          cat cresta-source.zip.part-* > cresta-source.zip
          unzip -oq cresta-source.zip
          rm -f cresta-source.zip cresta-source.zip.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish Cresta Marine website"
          git push
